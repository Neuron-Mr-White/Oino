[tools]
# The Node used by apps/unipi (vite, vitest, tsc) and by the release builds.
# Rust stays on rustup via rust-toolchain.toml (mise's rust builds from source).
node = "24.22.1"

[env]
# Build-cache budget for target/ and extensions/target/ combined
# (app-convention: every build cache has a size limit). Enforced by `mise run gc`.
OINO_TARGET_BUDGET_GB = "30"
OINO_TARGET_GC_AGE_HOURS = "1"

[tasks.start]
description = "Start the dev services in the background (dev desktop app + its isolated dev host); stops a previous run first, so running it twice stays clean"
run = "scripts/unipi-dev-svc.sh start"

[tasks.stop]
description = "Stop the dev services started by `mise run start` (never the installed app)"
run = "scripts/unipi-dev-svc.sh stop"

[tasks.status]
description = "Show whether the dev services are running"
run = "scripts/unipi-dev-svc.sh status"

[tasks.dev]
description = "Run the Oino TUI app"
run = "cargo run -p oino-cli --bin oino"

[tasks.bench]
description = "Core benchmarks (WP-C11), e.g. `mise run bench -- subagents --n 50`"
run = "cargo xtask bench"

[tasks.perf]
description = "Perf bench (scripts/perf/README.md): host RAM/CPU, subagent graph, long session, soak, app. Runs on an Agent37 VM via scripts/perf/remote.sh — never on the owner's PC"
run = "scripts/perf/remote.sh"

[tasks.gc]
description = "Trim build caches back under OINO_TARGET_BUDGET_GB (stale tmp, incremental, old artifacts)"
run = "scripts/target-gc.sh"

[tasks.clean]
description = "Remove all build caches: the cargo workspaces (root, extensions, apps/unipi, src-tauri), vite's dep cache and the frontend build output"
run = [
  "cargo clean",
  "cd extensions && cargo clean",
  "cd apps/unipi && cargo clean",
  "cd apps/unipi/src-tauri && cargo clean",
  "rm -rf apps/unipi/node_modules/.vite apps/unipi/node_modules/.vite-temp apps/unipi/dist",
]

[tasks."tui:render-test"]
description = "Run the Ratatui markdown rendering proof-of-concept"
run = "cargo run -p oino-tui --bin render-test"

[tasks."podman:up"]
description = "Build Oino, start/reuse the disposable Podman tmux sandbox, and attach"
run = "./scripts/podman-test.sh up"

[tasks."podman:start"]
description = "Start/reuse the disposable Podman sandbox without attaching"
run = "./scripts/podman-test.sh start"

[tasks."podman:attach"]
description = "Attach to the sandbox tmux session, creating the sandbox if needed"
run = "./scripts/podman-test.sh attach"

[tasks."podman:shell"]
description = "Open a bash shell in the disposable Podman sandbox"
run = "./scripts/podman-test.sh shell"

[tasks."podman:reset"]
description = "Clear and reinitialize the sandbox /workspace project"
run = "./scripts/podman-test.sh reset"

[tasks."podman:binary"]
description = "Build the Oino binary mounted into the Podman sandbox"
run = "./scripts/podman-test.sh binary"

[tasks."podman:image"]
description = "Build the Podman sandbox image with tmux and test utilities"
run = "./scripts/podman-test.sh image"

[tasks."podman:status"]
description = "Show disposable Podman sandbox status"
run = "./scripts/podman-test.sh status"

[tasks."podman:clean"]
description = "Remove the disposable Podman sandbox container, volumes, and image"
run = "./scripts/podman-test.sh clean"

[tasks.check]
description = "Check the full Rust workspace"
run = "cargo check --workspace"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Verify Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Run clippy with workspace warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run all workspace tests"
run = "cargo test --workspace"

[tasks."unipi:check"]
description = "Check the Unipi distribution workspace (apps/unipi)"
run = "cargo check --workspace --manifest-path apps/unipi/Cargo.toml"

[tasks."unipi:lint"]
description = "Clippy on the Unipi distribution workspace"
run = "cargo clippy --workspace --all-targets --manifest-path apps/unipi/Cargo.toml -- -D warnings"

[tasks."unipi:test"]
description = "Run Unipi distribution workspace tests (apps/unipi; add -- --ignored for the e2e)"
run = "cargo test --workspace --manifest-path apps/unipi/Cargo.toml"

[tasks."unipi:dev"]
description = "Run the Unipi desktop app from source (identifier dev.unipi.app.dev, productName 'UniPi Dev', isolated host dir)"
run = "scripts/unipi-dev.sh"

[tasks."unipi:build"]
description = "Local release bundle of the Unipi app for this OS (dev identifier dev.unipi.app.dev; apps/unipi/BUILDING.md)"
run = "scripts/unipi-build.sh"

[tasks."release:version"]
description = "Check or bump the UniPi Oino distribution version across all manifests and lockfiles (e.g. `mise run release:version -- 1.0.2`)"
run = "scripts/release/version.sh"

[tasks.doc]
description = "Build workspace docs without dependencies"
run = "cargo doc --workspace --no-deps"

[tasks."docs:check"]
description = "Validate public docs, stale references, and installer shell syntax"
run = "scripts/docs-check.sh"

[tasks."install:dry-run"]
description = "Exercise the portable installer without changing the system"
run = "OINO_DRY_RUN=1 sh scripts/install.sh"

[tasks."install:smoke"]
description = "Build and install Oino into a temporary prefix/home, then verify the binary and built-ins"
run = "scripts/install-smoke.sh"

[tasks.quality]
description = "Run the standard Oino quality gate"
run = [
  "scripts/docs-check.sh",
  "OINO_DRY_RUN=1 sh scripts/install.sh",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "cargo doc --workspace --no-deps",
]
