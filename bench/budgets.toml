# v3-perf acceptance budgets (docs/dev/v3/perf/00-spec.md §3), read by
# `cargo xtask bench <scenario> --gate`. Each table is one T-budget; every other key is a
# metric id the oino-bench host scenarios emit, with its limit in the metric's unit
# (ms / MB / % / count). The gated statistic (p95, p99, max, value) is fixed per metric
# in the scenario code and shown in the record's "gated" column.
#
# Scope: oino-bench measures the HOST side. App-side parts (paint, one-frame optimistic
# bubble, webview frame time) are measured by the app perf overlay; the host-side rows
# below are the host's share of those budgets (the host must leave the app its frame).

[T1]
title = "app launch -> sidebar with sessions <= 400 ms p95 (warm host); host share = sessions_list"
"list.first_ms" = 400
"list.warm_ms" = 100

[T2]
title = "open chat, already live -> timeline painted <= 100 ms p95; host share = snapshot reply"
"open.live.100.snapshot_ms" = 50
"open.live.40k.snapshot_ms" = 50

[T3]
title = "open record-only chat: last page <= 200 ms p95; runtime ready <= 1.0 s p95 (40k: 1.5 s)"
"open.cold.100.page_ms" = 200
"open.cold.5k.page_ms" = 200
"open.cold.40k.page_ms" = 200
"open.cold.real72mb.page_ms" = 200
"open.cold.100.ready_ms" = 1000
"open.cold.5k.ready_ms" = 1000
"open.cold.40k.ready_ms" = 1500
"open.cold.real72mb.ready_ms" = 1500

[T4]
title = "send -> own bubble <= 16 ms (optimistic in the app); WIRE PROXY ONLY = prompt -> ack (not optimistic bubble paint)"
