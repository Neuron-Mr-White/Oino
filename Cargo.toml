[workspace]
exclude = ["legacy"]
members = [
  "crates/oino-types",
  "crates/oino-agent-loop",
  "crates/oino-ai",
  "crates/oino-session",
  "crates/oino-resource",
  "crates/oino-env",
  "crates/oino-auth",
  "crates/oino-provider-catalog",
  "crates/oino-wasm-host",
  "crates/oino-agent",
  "crates/oino-tools",
  "crates/oino-settings",
  "crates/oino-resources",
  "crates/oino-models",
  "crates/oino-core",
  "crates/oino-extension-api",
  "crates/oino-bundle",
  "xtask",
  "crates/oino-client",
  "crates/oino-rpc",
  "crates/oino",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Neuron-Mr-White/Oino"

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
bytes = "1"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
sha2 = "0.10"
crossterm = "0.28"
dirs = "5"
proptest = "1"
pulldown-cmark = "0.12"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = { version = "0.8", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
syntect = "5"
syntect-assets = "0.23"
nucleo = "0.5"
thiserror = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"
webbrowser = "1.2.1"
mmdflux = { version = "2", default-features = false }
base64 = "0.22"
fs4 = { version = "0.13", features = ["sync"] }
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
nix = { version = "0.29", features = ["signal", "process"] }
regex = "1"
serde_yaml_ng = "0.10"
similar = "2"
tokio-util = "0.7"
tracing = "0.1"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
