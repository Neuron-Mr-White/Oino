[package]
name = "oino-extension-api"
version = "1.0.0-alpha.2"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "Contracts between oino-core and extension runtimes: instances, host services, manifests, permissions"

[features]
## Test doubles: `RecordingHostServices`, `FakeExtensionRuntime`.
testing = []

[dependencies]
futures.workspace = true
oino-ai = { path = "../oino-ai" }
oino-browser-protocol = { path = "../oino-browser-protocol" }
semver.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
sha2.workspace = true
thiserror = "2"
tokio-util.workspace = true

[dev-dependencies]
oino-extension-api = { path = ".", features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
