[package]
name = "oino-extension-api"
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "Contracts between oino-core and extension runtimes: instances, host services, manifests, permissions"

[features]
## Test doubles: `RecordingHostServices`, `FakeExtensionRuntime`.
testing = []

[dependencies]
futures.workspace = true
oino-ai = { path = "../oino-ai" }
semver.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
sha2.workspace = true
thiserror = "2"
tokio-util.workspace = true

[dev-dependencies]
oino-extension-api = { path = ".", features = ["testing"] }
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
