[package]
name = "oino-core"
version = "1.0.0-alpha.4"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "pi AgentSession, runtime, extension runner, compaction, retry"

[features]
## Test doubles: faux provider component, fake extensions, in-memory session builder.
testing = []

[dependencies]
futures.workspace = true
ignore.workspace = true
indexmap.workspace = true
oino-agent = { path = "../oino-agent" }
oino-ai = { path = "../oino-ai" }
oino-models = { path = "../oino-models" }
oino-resources = { path = "../oino-resources" }
oino-session = { path = "../oino-session" }
oino-settings = { path = "../oino-settings" }
oino-tools = { path = "../oino-tools" }
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio = { workspace = true, features = ["sync", "macros", "time", "rt", "fs"] }
tokio-util.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
oino-core = { path = ".", features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
