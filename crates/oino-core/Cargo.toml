[package]
name = "oino-core"
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "pi AgentSession, runtime, extension runner, compaction, retry"

[dependencies]
oino-agent = { path = "../oino-agent" }
oino-ai = { path = "../oino-ai" }
oino-models = { path = "../oino-models" }
oino-resources = { path = "../oino-resources" }
oino-session = { path = "../oino-session" }
oino-settings = { path = "../oino-settings" }
oino-tools = { path = "../oino-tools" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio.workspace = true

# Mirrors quality.md §2 until integration switches the root workspace lints (then `workspace = true`).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
