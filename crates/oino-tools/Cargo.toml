[package]
name = "oino-tools"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "Built-in tools for Oino agents: read, write, edit, bash, grep, find, ls"
readme = "README.md"
keywords = ["agent", "tools", "cli", "editor", "filesystem"]
categories = ["development-tools"]

[dependencies]
base64.workspace = true
futures.workspace = true
globset.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
image.workspace = true
oino-agent = { path = "../oino-agent", version = "1.0.1" }
oino-ai = { path = "../oino-ai", version = "1.0.1" }
regex.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "process", "signal"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
