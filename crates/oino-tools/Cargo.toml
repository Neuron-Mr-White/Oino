[package]
name = "oino-tools"
version = "1.0.2"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "Built-in tools for Oino agents: read, write, edit, bash, grep, find, ls"
readme = "README.md"
keywords = ["agent", "tools", "cli", "editor", "filesystem"]
categories = ["development-tools"]

[dependencies]
base64.workspace = true
futures.workspace = true
globset.workspace = true
grep-matcher.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
image.workspace = true
oino-agent = { path = "../oino-agent", version = "1.0.2" }
oino-ai = { path = "../oino-ai", version = "1.0.2" }
regex.workspace = true
rquickjs = { version = "0.11", features = ["futures", "parallel"] }
uuid.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "process", "signal"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop"] }

[dev-dependencies]
oino-wasm-host = { path = "../oino-wasm-host", default-features = false, features = ["testing"] }
oino-extension-api = { path = "../oino-extension-api" }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[lints]
workspace = true
