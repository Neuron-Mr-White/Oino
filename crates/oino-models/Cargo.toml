[package]
name = "oino-models"
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "pi model registry, models.json, model resolution, auth storage, virtual models"

[dependencies]
oino-ai = { path = "../oino-ai" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"

# Mirrors quality.md §2 until integration switches the root workspace lints (then `workspace = true`).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
