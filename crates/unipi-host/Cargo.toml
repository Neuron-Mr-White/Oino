[package]
name = "unipi-host"
version = "1.0.0"
edition = "2021"
description = "unipi-host daemon + CLI: iroh endpoint, pairing, host services (unipi/oino/1)"
license = "MIT"

[[bin]]
name = "unipi-host"
path = "src/main.rs"

[dependencies]
unipi-proto = { path = "../unipi-proto" }
# H3 (host.md §4.2): the host links oino-core in-process and runs every session through the
# wave-1 lazy client hub; extensions load on the process-shared wasm engine.
oino-client = { path = "../oino-client" }
oino-core = { path = "../oino-core" }
oino-extension-api = { path = "../oino-extension-api" }
oino-models = { path = "../oino-models" }
oino-settings = { path = "../oino-settings" }
oino-wasm-host = { path = "../oino-wasm-host" }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

tokio = { version = "1", features = ["full"] }
dunce = "1"
iroh.workspace = true
iroh-tickets.workspace = true
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
qrcode = "0.14"
rand = "0.9"
subtle = "2.6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4.2"
url = "2.5.8"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
sha2 = "0.11.0"
aes-gcm = "0.11"
base64 = "0.22"
# UNI-292: CloakBrowser download — Ed25519-signed SHA256SUMS, .tar.gz archives.
ed25519-dalek = "3"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# UNI-294: Chrome cookie import — a private sqlite copy, Linux v10/v11 decryption.
rusqlite = { version = "0.31", features = ["bundled"] }
aes = "0.9"
cbc = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
sha1 = "0.10"
tempfile = "3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
croner = "4.0.1"
chrono-tz = "0.10.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
shell-words = "1.1.1"
nix = { version = "0.31.3", features = ["process", "signal"] }
iana-time-zone = "0.1.65"

# UNI-228: parent-death watch + kill(pid,0) for the instance lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# UNI-247: Windows — named-pipe detection in `pair_cli`; v2 — the owner-only
# named-pipe listener in `local.rs` (spec host.md §6.1).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
# WP-H3 acceptance (`tests/sessions_hub.rs`): the faux provider and fake components.
oino-agent = { path = "../oino-agent" }
oino-core = { path = "../oino-core", features = ["testing"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
base64 = "0.22"
aes-gcm = "0.11"

[lints.clippy]
# The host's error type is `AppErrorDto`, the wire envelope it shares with the
# TS app (code, message, hint, path, detail, retryable). Linking oino-core in
# process (WP-H3) turns on serde_json's `preserve_order` for the whole build,
# which grows it past clippy's 128-byte threshold — boxing it would change the
# protocol, so the lint is off here.
result_large_err = "allow"
