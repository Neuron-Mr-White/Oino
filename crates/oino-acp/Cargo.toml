[package]
name = "oino-acp"
version = "1.0.0-alpha.4"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "ACP v1 (Agent Client Protocol) agent adapter over oino-core sessions"

[dependencies]
agent-client-protocol = { version = "=3.5.0", features = ["stdio", "unstable_session_fork"] }
futures.workspace = true
oino-agent = { path = "../oino-agent" }
oino-ai = { path = "../oino-ai" }
oino-client = { path = "../oino-client" }
oino-core = { path = "../oino-core" }
oino-models = { path = "../oino-models" }
oino-session = { path = "../oino-session" }
oino-settings = { path = "../oino-settings" }
oino-tools = { path = "../oino-tools" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
thiserror = "2"
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
indexmap.workspace = true
oino-core = { path = "../oino-core", features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = { workspace = true, features = ["compat"] }

[lints]
workspace = true
