[package]
name = "oino-acp"
version = "1.0.2"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "ACP v1 (Agent Client Protocol) agent adapter over oino-core sessions"
readme = "README.md"
keywords = ["acp", "agent", "protocol", "ide"]
categories = ["api-bindings"]

[dependencies]
agent-client-protocol = { version = "=3.5.0", features = ["stdio", "unstable_session_fork"] }
futures.workspace = true
oino-agent = { path = "../oino-agent", version = "1.0.2" }
oino-ai = { path = "../oino-ai", version = "1.0.2" }
oino-client = { path = "../oino-client", version = "1.0.2" }
oino-core = { path = "../oino-core", version = "1.0.2" }
oino-models = { path = "../oino-models", version = "1.0.2" }
oino-session = { path = "../oino-session", version = "1.0.2" }
oino-settings = { path = "../oino-settings", version = "1.0.2" }
oino-tools = { path = "../oino-tools", version = "1.0.2" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
thiserror = "2"
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
indexmap.workspace = true
oino-core = { path = "../oino-core", version = "1.0.2", features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = { workspace = true, features = ["compat"] }

[lints]
workspace = true
