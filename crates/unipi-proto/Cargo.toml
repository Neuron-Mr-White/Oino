[package]
name = "unipi-proto"
version = "1.0.0"
edition = "2021"
description = "Wire protocol types and framing for the UniPi host and app (unipi/oino/1, proto v2)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
