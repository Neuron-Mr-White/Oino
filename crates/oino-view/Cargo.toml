[package]
name = "oino-view"
version = "1.0.0-alpha.4"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "Frontend-agnostic view models for Oino clients: transcript, extension UI state, tree, sessions, composer, keybindings"

[dependencies]
indexmap.workspace = true
oino-agent = { path = "../oino-agent" }
oino-ai = { path = "../oino-ai" }
oino-core = { path = "../oino-core" }
oino-session = { path = "../oino-session", default-features = false }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
unicode-width.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
