[package]
name = "oino-resources"
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "pi resource loading: context files, SYSTEM/APPEND, skills, prompt templates, system prompt"

[dependencies]
globset.workspace = true
ignore.workspace = true
indexmap.workspace = true
oino-ai = { path = "../oino-ai" }
oino-settings = { path = "../oino-settings" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng.workspace = true
thiserror = "2"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

# Mirrors quality.md §2 until integration switches the root workspace lints (then `workspace = true`).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
