[package]
name = "oino-resources"
version = "1.0.2"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "Resource loading for Oino: context files, skills, prompt templates, system prompt, project trust"
readme = "README.md"
keywords = ["agent", "resources", "skills", "prompt", "config"]
categories = ["config", "filesystem"]

[dependencies]
globset.workspace = true
ignore.workspace = true
indexmap.workspace = true
oino-ai = { path = "../oino-ai", version = "1.0.2" }
oino-settings = { path = "../oino-settings", version = "1.0.2" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng.workspace = true
thiserror = "2"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
