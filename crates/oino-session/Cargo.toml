[package]
name = "oino-session"
version = "1.0.0-alpha.2"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "pi session format v3: entries, migration, context projection and SessionManager"

[features]
default = ["manager"]
## Synchronous std file I/O: `SessionManager`, listing, legacy-file migration.
manager = []

[dependencies]
indexmap.workspace = true
oino-ai = { path = "../oino-ai" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
uuid = { workspace = true, features = ["v4", "v7"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[[test]]
name = "golden_pi"
required-features = ["manager"]

[[test]]
name = "legacy_migration"
required-features = ["manager"]

[[test]]
name = "manager"
required-features = ["manager"]

[lints]
workspace = true
