[package]
name = "oino-tui"
version = "1.0.2"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "Oino interactive terminal client over oino-client"
readme = "README.md"
keywords = ["tui", "terminal", "agent", "llm"]
categories = ["command-line-interface"]

[features]
default = ["local-host"]
## `LocalHost`: session listing, settings, keybindings and clipboard from the local agent dir
## (stopgap until the matching `_oino/*` backend commands exist).
local-host = ["dep:oino-resources", "dep:oino-settings"]

[dependencies]
base64.workspace = true
crossterm = { workspace = true, features = ["bracketed-paste", "event-stream"] }
futures.workspace = true
indexmap.workspace = true
oino-agent = { path = "../oino-agent", version = "1.0.2" }
oino-ai = { path = "../oino-ai", version = "1.0.2" }
oino-client = { path = "../oino-client", version = "1.0.2", default-features = false }
oino-core = { path = "../oino-core", version = "1.0.2" }
oino-resources = { path = "../oino-resources", version = "1.0.2", optional = true }
oino-session = { path = "../oino-session", version = "1.0.2" }
oino-settings = { path = "../oino-settings", version = "1.0.2", optional = true }
oino-ui = { path = "../oino-ui", version = "1.0.2" }
oino-view = { path = "../oino-view", version = "1.0.2" }
pulldown-cmark = { workspace = true, default-features = false }
ratatui.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
thiserror = "2"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
insta.workspace = true
# WP-U2: regenerates crates/oino-ui/tests/layout_vectors.json from ratatui.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[bench]]
name = "ui_render"
harness = false

[lints]
workspace = true
