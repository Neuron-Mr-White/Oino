[package]
name = "oino-wasm-host"
version = "0.1.3"
edition.workspace = true
license.workspace = true

[dependencies]
oino-agent-loop = { path = "../oino-agent-loop" }
oino-extension-core = { path = "../oino-extension-core" }
oino-extension-runtime = { path = "../oino-extension-runtime" }
oino-types = { path = "../oino-types" }
anyhow = "1"
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing = "0.1"
uuid.workspace = true
wasmtime = { version = "=48.0.2", features = ["component-model", "async", "cranelift", "cache", "pooling-allocator"] }
wasmtime-wasi = "=48.0.2"
wasmtime-wasi-http = "=48.0.2"
wasmtime-wasi-io = "=48.0.2"
http = "1"
http-body-util = "0.1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
