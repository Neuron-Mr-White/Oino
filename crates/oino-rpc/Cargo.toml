[package]
name = "oino-rpc"
version = "1.0.0-alpha.3"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "pi RPC JSONL codec, RPC server over a SessionBackend, typed RPC client"

[dependencies]
futures.workspace = true
oino-agent = { path = "../oino-agent" }
oino-ai = { path = "../oino-ai" }
oino-client = { path = "../oino-client", default-features = false }
oino-core = { path = "../oino-core" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio = { workspace = true, features = ["io-util", "process", "sync", "macros", "rt", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
