[package]
name = "oino-rpc"
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "pi RPC JSONL codec, RPC server over a SessionBackend, typed RPC client"

[dependencies]
futures.workspace = true
oino-agent = { path = "../oino-agent" }
oino-ai = { path = "../oino-ai" }
oino-client = { path = "../oino-client", default-features = false }
oino-core = { path = "../oino-core" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio = { workspace = true, features = ["io-util", "process", "sync", "macros", "rt", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# Mirrors quality.md §2 until integration switches the root workspace lints (then `workspace = true`).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
