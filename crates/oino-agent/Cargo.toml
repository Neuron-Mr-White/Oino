[package]
name = "oino-agent"
version = "1.0.0-alpha.3"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "pi-agent-core: agent loop, tool execution, stateful Agent with queues"

[dependencies]
futures.workspace = true
indexmap.workspace = true
oino-ai = { path = "../oino-ai" }
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio = { workspace = true, features = ["sync", "macros", "time"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
