[package]
name = "oino-agent"
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "pi-agent-core: agent loop, tool execution, stateful Agent with queues"

[dependencies]
futures.workspace = true
indexmap.workspace = true
oino-ai = { path = "../oino-ai" }
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio = { workspace = true, features = ["sync", "macros", "time"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

# Mirrors quality.md §2 until integration switches the root workspace lints (then `workspace = true`).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
