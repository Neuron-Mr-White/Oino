[package]
name = "oino-agent"
version = "1.0.1"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "Agent loop, tool execution and a stateful agent with queues for Oino"
readme = "README.md"
keywords = ["agent", "llm", "ai", "tools", "asynchronous"]
categories = ["asynchronous"]

[dependencies]
futures.workspace = true
indexmap.workspace = true
oino-ai = { path = "../oino-ai", version = "1.0.1" }
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio = { workspace = true, features = ["sync", "macros", "time"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
