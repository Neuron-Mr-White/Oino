[package]
name = "oino-kanboard"
version = "1.0.0-alpha.0"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "Kanboard for Oino: task format, transition rules, dependency graph, CLI and the board daemon (JSON API + SSE)"
keywords = ["kanboard", "oino", "tasks"]
categories = ["command-line-utilities"]

[[bin]]
name = "oino-kanboard"
path = "src/main.rs"

[lib]
name = "oino_kanboard"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
base64.workspace = true
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getrandom = "0.3"
mime_guess = "2"
notify = "8"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "io-util"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Mirrors quality.md §2 until integration switches the root workspace lints (then `workspace = true`).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
