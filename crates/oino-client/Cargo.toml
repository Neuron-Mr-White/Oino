[package]
name = "oino-client"
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "Oino client SDK: SessionBackend contract, RPC command records, in-process and fake backends"
readme = "README.md"
keywords = ["client", "rpc", "agent", "sdk"]
categories = ["asynchronous"]

[features]
default = ["in-process"]
## `InProcessBackend` over an `oino-core` `AgentSessionRuntime`.
in-process = []

[dependencies]
futures.workspace = true
oino-agent = { path = "../oino-agent", version = "1.0.1" }
oino-ai = { path = "../oino-ai", version = "1.0.1" }
oino-core = { path = "../oino-core", version = "1.0.0" }
oino-session = { path = "../oino-session", version = "1.0.0" }
oino-settings = { path = "../oino-settings", version = "1.0.1" }
oino-models = { path = "../oino-models", version = "1.0.1" }
indexmap.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio = { workspace = true, features = ["sync", "rt", "time"] }

[dev-dependencies]
indexmap.workspace = true
oino-core = { path = "../oino-core", version = "1.0.0", features = ["testing"] }
oino-models = { path = "../oino-models", version = "1.0.1" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
