[package]
name = "oino-client"
version = "1.0.0-alpha.2"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "SessionBackend contract, RPC command records, in-process and fake backends"

[features]
default = ["in-process"]
## `InProcessBackend` over an `oino-core` `AgentSessionRuntime`.
in-process = []

[dependencies]
futures.workspace = true
oino-agent = { path = "../oino-agent" }
oino-ai = { path = "../oino-ai" }
oino-core = { path = "../oino-core" }
oino-session = { path = "../oino-session" }
oino-settings = { path = "../oino-settings" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = "2"
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
indexmap.workspace = true
oino-core = { path = "../oino-core", features = ["testing"] }
oino-models = { path = "../oino-models" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
