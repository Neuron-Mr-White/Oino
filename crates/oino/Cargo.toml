[package]
name = "oino"
version = "1.0.0-alpha.4"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "The Oino command-line binary: pi-compatible CLI, interactive (TUI), print, JSON, RPC and ACP modes"

[[bin]]
name = "oino"
path = "src/main.rs"

[features]
## Scripted `builtin:faux` provider and `builtin:ui-probe` extension (tests only).
faux = []

[dependencies]
base64.workspace = true
futures.workspace = true
indexmap.workspace = true
oino-acp = { path = "../oino-acp" }
oino-agent = { path = "../oino-agent" }
oino-ai = { path = "../oino-ai" }
oino-browser = { path = "../oino-browser" }
oino-bundle = { path = "../oino-bundle" }
oino-client = { path = "../oino-client" }
oino-core = { path = "../oino-core" }
oino-cron = { path = "../oino-cron" }
oino-extension-api = { path = "../oino-extension-api" }
oino-models = { path = "../oino-models" }
oino-rpc = { path = "../oino-rpc" }
oino-session = { path = "../oino-session" }
oino-tui = { path = "../oino-tui" }
oino-settings = { path = "../oino-settings" }
oino-tools = { path = "../oino-tools" }
oino-wasm-host = { path = "../oino-wasm-host" }
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tempfile.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true

[dev-dependencies]
oino = { path = ".", features = ["faux"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["term", "fs"] }

[lints]
workspace = true
