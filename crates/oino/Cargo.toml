[package]
name = "oino-cli"
version = "1.0.2"
edition = "2024"
rust-version = "1.99"
license.workspace = true
repository.workspace = true
description = "The Oino command-line binary: interactive (TUI), print, JSON, RPC and ACP modes"
readme = "README.md"
build = "build.rs"
keywords = ["cli", "agent", "llm", "tui", "ai"]
categories = ["command-line-interface", "development-tools"]

[lib]
name = "oino"
path = "src/lib.rs"

[[bin]]
name = "oino"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
## Scripted `builtin:faux` provider and `builtin:ui-probe` extension (tests only).
faux = []

[dependencies]
base64.workspace = true
futures.workspace = true
indexmap.workspace = true
oino-acp = { path = "../oino-acp", version = "1.0.2" }
oino-agent = { path = "../oino-agent", version = "1.0.2" }
oino-ai = { path = "../oino-ai", version = "1.0.2" }
oino-client = { path = "../oino-client", version = "1.1.0" }
oino-core = { path = "../oino-core", version = "1.0.1" }
oino-extension-api = { path = "../oino-extension-api", version = "1.0.2" }
oino-models = { path = "../oino-models", version = "1.0.2" }
oino-rpc = { path = "../oino-rpc", version = "1.0.2" }
oino-session = { path = "../oino-session", version = "1.0.2" }
oino-tui = { path = "../oino-tui", version = "1.0.2" }
oino-settings = { path = "../oino-settings", version = "1.0.2" }
oino-tools = { path = "../oino-tools", version = "1.0.2" }
oino-wasm-host = { path = "../oino-wasm-host", version = "1.0.1" }
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
tempfile.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
oino = { package = "oino-cli", path = ".", features = ["faux"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["term", "fs"] }

[lints]
workspace = true
