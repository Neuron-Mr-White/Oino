name: ci

# quality.md §6. The toolchain (1.99.0 + wasm32-wasip2) comes from rust-toolchain.toml.
on:
  push:
    branches: [main, v1-alpha, v2]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check
        working-directory: extensions
      - run: cargo fmt --all --check
        working-directory: apps/unipi

  wasm:
    name: extension components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nextensions -> target\napps/unipi -> target"
      - name: Build components (extensions/dist)
        run: cargo xtask wasm
      - name: Checksums match the committed checksums.json
        run: git diff --exit-code extensions/dist/checksums.json
      - name: Clippy (wasm32-wasip2)
        working-directory: extensions
        run: cargo clippy --target wasm32-wasip2 --workspace --all-targets -- -D warnings -W clippy::pedantic
      - name: ui-protocol v2 gate (no OUS v1 node trees)
        run: sh scripts/ui-v1-gate.sh
      - name: Native extension tests
        working-directory: extensions
        run: cargo test --workspace -j 4
      - name: WASM host harnesses
        env:
          JOBS: '2'
        run: |
          for h in extensions/unipi/*/harness/run.sh; do
            echo "::group::$h"; sh "$h"; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: extensions/dist

  root:
    name: core workspace
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: extensions/dist
      - run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::pedantic
      - run: cargo test --workspace -j 4
      - run: cargo doc --workspace --no-deps
      - run: cargo install wasm-tools --locked && cargo xtask wit
      - name: Install smoke
        run: sh scripts/install-smoke.sh

  unipi:
    name: unipi workspace (apps/unipi)
    # repo-split: the UniPi distribution crates build in their own cargo workspace;
    # the root `core workspace` job stays oino-only. The wasm job's dist artifact
    # supplies the staged packages for the WP-H10 host + client e2e.
    if: github.ref_name == 'v2' || github.event_name == 'workflow_dispatch'
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/unipi -> target"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: extensions/dist
      - run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::pedantic
        working-directory: apps/unipi
      - run: cargo test --workspace -j 4
        working-directory: apps/unipi
      - name: Headless host + client e2e + perf gates (spec-host WP-H10)
        env:
          CARGO_BUILD_JOBS: '8'
        run: cargo test -p unipi-host --test integration -- --ignored --nocapture
        working-directory: apps/unipi

  v2-host-integration-windows:
    name: v2 host integration (Windows, secondary)
    # The §7.4/§9 e2e on the named-pipe transport; terminal/cron scenarios are Unix-only.
    if: github.ref_name == 'v2' || github.event_name == 'workflow_dispatch'
    needs: wasm
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/unipi -> target"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: extensions/dist
      - name: Headless host + client e2e
        env:
          CARGO_BUILD_JOBS: '8'
        run: cargo test -p unipi-host --test integration -- --ignored --nocapture
        working-directory: apps/unipi

  docs-and-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/docs-check.sh
      - run: OINO_DRY_RUN=1 sh scripts/install.sh
      - name: Installer against a fake release dir (OINO_INSTALL_BASE_URL)
        run: sh scripts/install-test.sh

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and dry-run install.ps1
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw scripts/install.ps1), [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }
          $env:OINO_DRY_RUN = '1'
          ./scripts/install.ps1

  release-checks:
    # Cheap PR-side coverage of the release workflow's build steps
    # (.github/workflows/release.yml). The tag/release jobs themselves live in
    # release.yml (one release channel; ci.yml no longer publishes on tags).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\napps/unipi -> target\napps/unipi/src-tauri -> target"
      - name: actionlint (workflows)
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          ./actionlint -shellcheck= -pyflakes=
      - name: Sidecar (unipi-host) release check
        run: cargo check --release -p unipi-host --manifest-path apps/unipi/Cargo.toml
      # The app bundle build with the dev identifier merge. Required since the
      # [app-fix] wave (hosts_commands.rs pruned, WP-A5 landed): the debug
      # no-bundle build is green again.
      - name: cargo tauri build --debug --no-bundle (dev identifier)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          cargo build --manifest-path apps/unipi/Cargo.toml -p unipi-host
          triple=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/unipi/src-tauri/binaries
          cp "apps/unipi/target/debug/unipi-host" "apps/unipi/src-tauri/binaries/unipi-oino-host-$triple"
          cd apps/unipi && npm ci && cargo tauri build --debug --no-bundle --config tauri.dev.conf.json
