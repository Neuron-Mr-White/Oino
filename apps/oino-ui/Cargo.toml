[package]
name = "oino-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared GPUI views and view models for Oino Desktop and Oino Mobile"

[features]
default = ["views"]
## GPUI views (the view models build and test without GPUI).
views = ["dep:gpui-kit"]
## Touch layouts for Oino Mobile (`oino_ui::mobile`, owned by gpui-mobile).
mobile = ["views"]
## Side-pane Browser tab (gpui-webview; desktop only, X11/XWayland on Linux).
browser = ["views", "dep:gpui-webview", "dep:wry", "dep:image"]
## Bottom-frame Terminal tab (alacritty_terminal + the platform PTY; desktop only).
terminal = ["views", "dep:alacritty_terminal"]

[dependencies]
futures.workspace = true
indexmap.workspace = true
gpui-kit = { workspace = true, optional = true }
gpui-webview = { workspace = true, optional = true }
wry = { workspace = true, optional = true }
alacritty_terminal = { workspace = true, optional = true }
oino-agent.workspace = true
oino-ai.workspace = true
oino-client = { workspace = true }
oino-core.workspace = true
oino-extension-api.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
oino-session.workspace = true
oino-view.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
