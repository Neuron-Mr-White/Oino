[package]
name = "oino-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Oino Mobile: GPUI phone app (Android + iOS) embedding oino-core with the bundled extensions"
publish = false

[lib]
name = "oino_mobile"
# cdylib: Android `NativeActivity` .so; staticlib: linked into the iOS app; rlib: host checks.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui-kit.workspace = true
indexmap.workspace = true
log.workspace = true
oino-ai.workspace = true
oino-bundle.workspace = true
oino-client.workspace = true
oino-core.workspace = true
oino-session.workspace = true
oino-ui = { workspace = true, features = ["mobile"] }
oino-wasm-host.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
gpui-mobile.workspace = true

# Debug builds of rust-embed read assets from the build machine's disk; a phone has no
# such path, so embed gpui-kit's icons in every profile (feature unification).
rust-embed = { version = "8.7.2", default-features = false, features = ["debug-embed"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity.workspace = true
android_logger.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# The workspace lints, except `unsafe_code = "deny"` (not `forbid`): the platform entry
# points need `#[unsafe(no_mangle)]` (see the crate docs).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
