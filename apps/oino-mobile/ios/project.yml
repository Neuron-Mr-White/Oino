# XcodeGen spec for the Oino Mobile iOS host (gpui-app §4, §6).
# Generated by `../scripts/build.sh ios`; the Rust static library is built by that script
# (not by an Xcode build phase) so the cargo flags stay in one place.
#   OINO_IOS_TEAM   Apple development team id (required for device builds)
name: OinoMobile
options:
  bundleIdPrefix: dev.oino
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  OinoMobile:
    type: application
    platform: iOS
    sources:
      - path: main.m
      - path: oino_ios.h
        buildPhase: headers
      - path: LaunchScreen.storyboard
        buildPhase: resources
      - path: Assets.xcassets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.oino.mobile
        PRODUCT_NAME: Oino
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${OINO_IOS_TEAM}
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_BITCODE: NO
        # Statically linked Rust library: no debug dylib executor, no dead-code stripping
        # of the force-loaded archive.
        ENABLE_DEBUG_DYLIB: NO
        DEAD_CODE_STRIPPING: NO
        HEADER_SEARCH_PATHS: ["$(PROJECT_DIR)"]
        ARCHS: arm64
        # Simulator: the host CPU (build.sh sets OINO_SIM_ARCH / OINO_SIM_TARGET: arm64 +
        # aarch64-apple-ios-sim on Apple silicon, x86_64 + x86_64-apple-ios on Intel).
        "ARCHS[sdk=iphonesimulator*]": ${OINO_SIM_ARCH}
        ONLY_ACTIVE_ARCH: YES
        OINO_PROFILE: debug
        "OINO_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../target/${OINO_SIM_TARGET}/$(OINO_PROFILE)/liboino_mobile.a"
        "OINO_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios/$(OINO_PROFILE)/liboino_mobile.a"
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(OINO_STATIC_LIB)"
          - "-lc++"
          - "-framework UIKit"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework QuartzCore"
          - "-framework CoreGraphics"
          - "-framework CoreText"
          - "-framework CoreFoundation"
          - "-framework Foundation"
          - "-framework Security"
          - "-framework SystemConfiguration"
          - "-framework UserNotifications"
          - "-framework SafariServices"
          - "-framework UniformTypeIdentifiers"
          # Linked by gpui-mobile modules that are compiled regardless of package features.
          - "-framework AVFoundation"
          - "-framework AudioToolbox"
          - "-framework CoreMedia"
          - "-ObjC"
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "0"
        Release:
          OINO_PROFILE: release
          GCC_OPTIMIZATION_LEVEL: "s"
