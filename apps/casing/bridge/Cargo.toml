[package]
name = "oino-casing-bridge"
version = "0.1.0"
edition = "2024"
description = "Casing spike: speaks unipi/app/1 on a local socket, translates chat ops to oino RPC children"
license = "MIT"

[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
unipi-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "io-util", "net", "process"] }

[[bin]]
name = "oino-casing-bridge"
path = "src/main.rs"
