<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0A0908"><title>Unipi</title>
<style>
/* In-app splash (lib/splash.ts): inline so it paints before the bundle. */
html,body{background:#0A0908;margin:0}
#splash{position:fixed;inset:0;z-index:1000;background:#0A0908;transition:opacity 320ms ease-out}
/* Crab centred and sized like the native Android 12 splash icon (160dp wide) so the hand-over is seamless. */
#splash .splash-stage{position:absolute;left:50%;top:50%;width:160px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
#splash.splash-out{opacity:0;pointer-events:none}
#splash .splash-crab{width:160px;height:auto;transform-origin:50% 100%;animation:splash-hop 620ms cubic-bezier(.3,1.4,.5,1) both,splash-bob 1.6s ease-in-out 620ms infinite}
/* Logo wordmark: UNIPI, one colour per letter (style.css --color-wm-*; same as the TUI renderWordmark), heavy + dark outline like docs/assets/unipi-logo.png. */
#splash .splash-word{position:absolute;top:calc(100% + 24px);display:flex;gap:6px;font:900 42px/1 'Arial Black','Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:0;white-space:nowrap;opacity:0;animation:splash-word 520ms ease-out 260ms forwards}
#splash .splash-word span{-webkit-text-stroke:3px #141211;paint-order:stroke fill;text-shadow:0 4px 0 color-mix(in srgb,currentColor 45%,#000),0 5px 0 #141211,0 6px 14px rgb(0 0 0 / 60%)}
#splash .wm-u{color:#FFFFFF}#splash .wm-n{color:#28BEF0}#splash .wm-i{color:#5AD25A}#splash .wm-p{color:#FAC828}#splash .wm-i2{color:#F03C32}
#splash .splash-shadow{position:absolute;top:calc(100% + 4px);width:96px;height:8px;border-radius:50%;background:rgb(240 48 24 / 16%);animation:splash-shadow 1.6s ease-in-out 620ms infinite}
@keyframes splash-hop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-18px) scale(.96,1.05)}62%{transform:translateY(0) scale(1.06,.92)}100%{transform:translateY(0) scale(1,1)}}
@keyframes splash-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes splash-shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.86);opacity:.7}}
@keyframes splash-word{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash .splash-crab,#splash .splash-shadow{animation:none}#splash .splash-word{animation:none;opacity:1}#splash{transition:none}}
</style></head><body><div id="splash" aria-hidden="true"><div class="splash-stage"><img class="splash-crab" src="./src/assets/unicrab-splash.png" alt=""><span class="splash-shadow"></span><span class="splash-word" aria-label="UNIPI"><span class="wm-u">U</span><span class="wm-n">N</span><span class="wm-i">I</span><span class="wm-p">P</span><span class="wm-i2">I</span></span></div></div><script>requestAnimationFrame(function(){window.__splashShownAt=performance.now();});</script><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
