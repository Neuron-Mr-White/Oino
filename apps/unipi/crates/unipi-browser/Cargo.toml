[package]
name = "unipi-browser"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host browser service: Chromium-family engines over an in-house CDP client, tab registry, snapshot, trusted input, screencast (browser-control.md WP2)"

[dependencies]
base64.workspace = true
dirs.workspace = true
futures.workspace = true
globset.workspace = true
image.workspace = true
unipi-browser-protocol = { path = "../unipi-browser-protocol" }
oino-extension-api = { path = "../../../../crates/oino-extension-api", version = "1.0.2" }
regex.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
command-fds = { version = "0.3", features = ["tokio"] }
nix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }

[lints]
workspace = true
