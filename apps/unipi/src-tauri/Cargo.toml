[package]
name = "unipi-mobile"
version = "1.0.4"
description = "Unipi App — Tauri core"
authors = ["Unipi"]
edition = "2021"
license = "MIT"

# Own workspace: the Tauri app stays out of the root oino cargo workspace
# (host.md §3 — Tauri builds and target dirs differ).
[workspace]

# Release profile carried over from the dissolved `apps/unipi/Cargo.toml`
# workspace root (sidecar/app builds rely on it).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "unipi_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# tray-icon: the desktop tray (UNI-117); tauri only pulls it on desktop targets.
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-store = "=2.5.0"
tauri-plugin-log = "=2.10.0"
tauri-plugin-os = "=2.4.0"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-barcode-scanner = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "io-util", "net", "process"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "=1.0.0"
unipi-proto = { path = "../crates/unipi-proto" }
url = "2.5.8"
tauri-plugin-haptics = "2.4"
netdev = "0.46"
log = "0.4.34"
tauri-plugin-clipboard-manager = "2.4.1"
sha2 = "0.11.0"
# UNI-278: big uploads cross the IPC in base64 chunks (Android has no raw invoke bodies).
base64 = "0.22"

# UNI-214: native "Save as…" for pushed files on the desktop app (GTK, which
# Tauri already links on Linux — no xdg-portal/zbus stack).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
# UNI-117: native OS notifications ("needs you" / finished) and remembered
# window size/position — desktop app only, registered under #[cfg(desktop)].
tauri-plugin-notification = "=2.5.1"
tauri-plugin-window-state = "=2.5.0"
# UNI-263: desktop app self-update (signed artifacts from unipi.nrn.one/desktop/latest.json).
tauri-plugin-updater = "=2.13.3"
tauri-plugin-autostart = "=2.5.1"
# fix5-host: one app per user session — a second launch focuses the running
# window and exits instead of spawning a second host that fights over host.lock.
tauri-plugin-single-instance = "=2.5.5"
# UNI-240: the self-install engine downloads Node (nodejs.org, SHASUMS256-verified)
# and probes the npm registry — desktop only, never the phone build.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }

# UNI-256: read the GTK clipboard the webview uses (WebKitGTK hides clipboard
# images and copied files from the page). Same gtk Tauri already links.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# E-13: the same WebKitGTK binding wry uses (version pinned to Cargo.lock) — web-process-terminated.
webkit2gtk = "=2.0.2"
# Tray on Linux: the KSNI (StatusNotifierItem over D-Bus) backend instead of
# libappindicator, because only KSNI reports a left click (`Activate`) — so a
# press on the tray icon opens the window instead of only showing the menu.
# Same tray-icon Tauri links; with both backends on, tray-icon picks KSNI.
tray-icon = { version = "=0.25.1", default-features = false, features = ["ksni"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"

