# UniPi distribution workspace (repo-split): the oino SDK lives in the root
# workspace (crates/oino*); everything UniPi-specific builds here. The crates
# depend on the SDK via path+version (path = "../../crates/…", the versions
# match the published crates.io releases), so this workspace resolves against
# the local checkout in development and against crates.io when oino is
# installed as a dependency.
#
# `src-tauri/` keeps its own standalone workspace (own Cargo.lock and target
# dir): Tauri builds and android/ios targets differ (host.md §3).
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0-alpha.5"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Neuron-Mr-White/Oino"

[workspace.dependencies]
indexmap = { version = "2", features = ["serde"] }
# R4 (host.md §13): the iroh family is pinned once here — the version the
# imported unipi-app used (1.3) — so unipi-host and the app share one
# resolution; upgrades happen deliberately with the transport tests as gate.
iroh = "1.3"
iroh-tickets = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "4"
iana-time-zone = "0.1"
base64 = "0.22"
dirs = "5"
fs4 = { version = "0.13", features = ["sync"] }
futures = "0.3"
globset = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
nix = { version = "0.29", features = ["signal", "process"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

# quality.md §2. Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

# Build-cache size policy (app-convention), same as the root workspace;
# budget enforced by scripts/target-gc.sh.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
