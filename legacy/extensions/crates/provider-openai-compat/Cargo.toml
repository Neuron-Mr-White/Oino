[package]
name = "provider-openai-compat"
version = "0.1.3"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oino-extension-guest = { path = "../oino-extension-guest" }
oino-extension-guest-provider = { path = "../oino-extension-guest-provider" }
oino-provider-kit = { path = "../oino-provider-kit" }
oino-types = { path = "../../../crates/oino-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
